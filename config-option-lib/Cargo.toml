[package]
name = "config-option-lib"
version = "0.1.0"
build = "build.rs"
authors = ["Vladislav Nepogodin <nepogodin.vlad@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
cxx = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zbus = { version = "5", features = ["tokio"], default-features = false }
tokio = { version = "1.39", features = ["macros", "sync", "rt-multi-thread"] }
scx_loader = { git = "https://github.com/sched-ext/scx", rev = "b9a505cd1d6275818777ac3760abf04287b6758c", version = "1.0.7" }

[build-dependencies]
cxx-build = "1"

[lib]
crate-type = ["staticlib"]

[profile.release]
strip = "symbols"
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
