name: Checks

on:
  push:
    paths-ignore:
    - '.github/ISSUE_TEMPLATE/**'
    - 'LICENSE'
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Base job: generic Arch (arch base, mirrors build.yml). scx-manager is NOT
  # installed here, so this verifies the default WITH_SCX_MANAGER=OFF path
  # (configure QUIET, no link, guarded sources).
  cpp-linter:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: install deps
        run: |
          pacman -Syu --noconfirm cmake pkg-config ninja clang rust \
          mold llvm libc++ qt6-base qt6-tools polkit-qt6 python git ccache
          echo "/usr/lib" > /etc/ld.so.conf.d/00-ci-lib.conf
          ldconfig
        shell: bash

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-cpp-linter-${{ github.ref }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ccache-cpp-linter-${{ github.ref }}-
            ccache-cpp-linter-

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/cpm
          key: cpm-cpp-linter-${{ github.ref }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            cpm-cpp-linter-${{ github.ref }}-
            cpm-cpp-linter-

      - name: Configure CMake
        run: |
          export AR=llvm-ar
          export CC=clang
          export CXX=clang++
          export NM=llvm-nm
          export RANLIB=llvm-ranlib
          export CPM_SOURCE_CACHE="$HOME/.cache/cpm"

          # T-125: use ccache to speed up repeated CI builds.
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache

          # Configure into build/ (not build/Debug) and generate
          # compile_commands.json so clang-tidy has a compilation database.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -GNinja
        shell: bash

      - name: Run clang-tidy
        run: |
          # compile_commands.json lives in the build dir; clang-tidy -p
          # points at the directory that contains it.
          clang-tidy -p build src/*.cpp
        shell: bash

  # Dedicated scx job: cachyOS container (its repo provides scx-manager, an
  # AUR-only package on generic Arch). scxctl-ui is found, so
  # WITH_SCX_MANAGER auto-enables; this covers the ON code path.
  cpp-linter-scx:
    runs-on: ubuntu-latest
    # T-029: pinned to the digest of cachyos/cachyos:latest as of 2026-11-07
    # (the image only publishes a `latest` tag; digest pinning makes the CI
    # reproducible and prevents silent breakage from upstream image changes).
    container: cachyos/cachyos@sha256:4d5fb2f3ebda93ec745dc31f8983277b197933101747675e9705d2f84e236eaf
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: install deps
        run: |
          pacman -Syu --noconfirm cmake pkg-config ninja clang rust \
          mold llvm libc++ qt6-base qt6-tools polkit-qt6 python git scx-manager ccache
          echo "/usr/lib" > /etc/ld.so.conf.d/00-ci-lib.conf
          ldconfig
        shell: bash

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-cpp-linter-scx-${{ github.ref }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ccache-cpp-linter-scx-${{ github.ref }}-
            ccache-cpp-linter-scx-

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/cpm
          key: cpm-cpp-linter-scx-${{ github.ref }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            cpm-cpp-linter-scx-${{ github.ref }}-
            cpm-cpp-linter-scx-

      - name: Configure CMake (WITH_SCX_MANAGER=ON)
        run: |
          export AR=llvm-ar
          export CC=clang
          export CXX=clang++
          export NM=llvm-nm
          export RANLIB=llvm-ranlib
          export CPM_SOURCE_CACHE="$HOME/.cache/cpm"

          # T-125: use ccache to speed up repeated CI builds.
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache

          # Configure into build/ (not build/Debug) and generate
          # compile_commands.json so clang-tidy has a compilation database.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -GNinja
        shell: bash

      - name: Run clang-tidy
        run: |
          # compile_commands.json lives in the build dir; clang-tidy -p
          # points at the directory that contains it.
          clang-tidy -p build src/*.cpp
        shell: bash

  check_clang_format:
    name: "Check C++ style"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Run clang-format style check for C/C++/Protobuf programs.
      uses: jidicula/clang-format-action@v4.11.0
      with:
        clang-format-version: '16'
        check-path: 'src'
        exclude-regex: 'src/ini.hpp'

